name: DynamoRIO release artifact (manual)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the bundle; leave empty to only upload an Actions artifact
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/dynamorio-artifact.yml
    with:
      release_tag: ${{ inputs.release_tag }}
