name: QEMU user-mode release artifact

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the bundle; leave empty to only upload an Actions artifact
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            gcc-riscv64-linux-gnu \
            libcapstone-dev \
            libglib2.0-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            xz-utils
      - uses: dtolnay/rust-toolchain@stable
      - name: Build plugin-enabled QEMU user bundle
        run: utils/build-qemu-user-bundle.sh dist
      - name: Smoke-test x86 and exact RVV accounting
        run: |
          bundle="$(find dist -maxdepth 1 -name '*.tar.xz' -print -quit)"
          mkdir extracted
          tar -xf "${bundle}" -C extracted
          qemu_dir="$(find extracted -type d -path '*/bin' -print -quit)"

          "${qemu_dir}/qemu-riscv64" --help | grep -- '-plugin'
          cargo build -p miniperf-qemu-roofline

          x86_counts="${RUNNER_TEMP}/x86-counts"
          "${qemu_dir}/qemu-x86_64" \
            -plugin "./target/debug/libminiperf_qemu_roofline.so,output=${x86_counts}" \
            /bin/true
          grep -E '^scalar_int_ops=[1-9][0-9]*$' "${x86_counts}"
          grep -Fx 'rvv_state_errors=0' "${x86_counts}"

          riscv64-linux-gnu-gcc \
            -nostdlib \
            -static \
            -march=rv64gcv \
            -mabi=lp64d \
            utils/qemu-roofline/tests/fixtures/rvv-smoke.S \
            -o "${RUNNER_TEMP}/rvv-smoke"
          rvv_counts="${RUNNER_TEMP}/rvv-counts"
          "${qemu_dir}/qemu-riscv64" \
            -cpu rv64,v=true,vlen=256 \
            -plugin "./target/debug/libminiperf_qemu_roofline.so,output=${rvv_counts}" \
            "${RUNNER_TEMP}/rvv-smoke"
          grep -Fx 'vector_int_ops=6' "${rvv_counts}"
          grep -Fx 'vector_float_ops=12' "${rvv_counts}"
          grep -Fx 'vector_double_ops=4' "${rvv_counts}"
          grep -Fx 'rvv_state_errors=0' "${rvv_counts}"
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniperf-qemu-user
          path: |
            dist/*.tar.xz
            dist/*.sha256
          if-no-files-found: error
      - name: Attach bundle to an existing GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.tar.xz dist/*.sha256 --clobber
