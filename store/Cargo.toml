[package]
name = "miniperf-store"
version = "0.1.0"
edition = "2024"

[lib]
name = "store"

[dependencies]
anyhow = "1.0"
arrow = "59.2"
parquet = "59.2"
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
libc = "0.2"

[features]
default = ["session"]
session = ["dep:duckdb"]

[dev-dependencies]
tempfile = "3"
